    <h1 class="title topictitle1">读码器安全日志</h1>

    
    
    <div class="body taskbody"><p class="shortdesc">读码器安全日志功能用于记录和展示读码器在执行安全鉴权相关操作时的详细记录，确保操作可追溯。</p>

        <div class="section prereq p" id="GUID-7217336E-7A4A-4845-B887-E02317183D28__GUID-7973A555-F7C3-427F-A7DD-525E22654855">
            
            <p class="p">已连接支持安全鉴权功能的读码器。</p>

        </div>

        <ol class="ol steps" id="GUID-7217336E-7A4A-4845-B887-E02317183D28__GUID-65A630FE-5ED7-4878-A6E1-1C4BAC7EF49C"><li class="li step stepexpand" id="GUID-7217336E-7A4A-4845-B887-E02317183D28__GUID-B0E0C819-B64E-4A88-B5CA-8A0E6D66812F">
                <span class="ph cmd">在客户端主界面菜单，单击<span class="ph uicontrol">日志</span>并选择<span class="ph uicontrol">读码器安全日志</span>。</span>
            </li>
<li class="li step stepexpand" id="GUID-7217336E-7A4A-4845-B887-E02317183D28__GUID-477BF836-12F1-478F-9B16-E3E25BA15801">
                <span class="ph cmd">下拉<span class="ph uicontrol">读码器安全日志</span>页面左上角，下拉选择目标查看的读码器。</span>
                <div class="itemgroup info">
                    <p class="p">读码器安全日志中显示读码器相关操作的<span class="keyword parmname">时间</span>、<span class="keyword parmname">内容</span>、<span class="keyword parmname">结果</span>和<span class="keyword parmname">操作者IP</span>。</p>

                    <div class="fig fignone" id="GUID-7217336E-7A4A-4845-B887-E02317183D28__FIG_PWN_FNX_4HC">
                        
                        <img class="image" style="display:none;" id="GUID-7217336E-7A4A-4845-B887-E02317183D28__IMAGE_QWN_FNX_4HC" src="GUID-A78E52BE-68D0-40BE-8556-2F2E15EC24C2-high.png" width="1400" />
                    <div class="fig_caption"><span class="figcap">图 1 读码器安全日志</span></div></div>

                </div>
            </li>
<li class="li step stepexpand" id="GUID-7217336E-7A4A-4845-B887-E02317183D28__GUID-EEC7F112-128E-4EE3-99E1-43819BD5998B"><strong>可选操作： </strong>
                <span class="ph cmd">您可在<span class="ph uicontrol">读码器安全日志</span>页面右上角，选择每页显示的日志条数和翻页。</span>
            </li>
</ol>

    </div>


</div>
