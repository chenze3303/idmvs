<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDMVS 文档搜索</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: #0f1923;
  color: #e0e6ed;
  min-height: 100vh;
}

/* Header */
.header {
  background: linear-gradient(135deg, #1a2a3a 0%, #0d2137 100%);
  border-bottom: 1px solid rgba(64,158,255,0.2);
  padding: 20px 0;
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(10px);
}
.header-inner {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 24px;
  display: flex;
  align-items: center;
  gap: 20px;
}
.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  white-space: nowrap;
}
.logo-icon {
  width: 42px;
  height: 42px;
  background: linear-gradient(135deg, #409eff, #1677ff);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: 700;
  color: #fff;
  box-shadow: 0 4px 12px rgba(64,158,255,0.3);
}
.logo-text {
  font-size: 18px;
  font-weight: 600;
  color: #e8f0fe;
}
.logo-sub {
  font-size: 11px;
  color: #7a8fa6;
  margin-top: 2px;
}

/* Search */
.search-box {
  flex: 1;
  position: relative;
}
.search-input {
  width: 100%;
  padding: 12px 20px 12px 48px;
  border: 2px solid rgba(64,158,255,0.25);
  border-radius: 12px;
  background: rgba(255,255,255,0.06);
  color: #e0e6ed;
  font-size: 15px;
  outline: none;
  transition: all 0.3s;
}
.search-input::placeholder { color: #5a6d80; }
.search-input:focus {
  border-color: #409eff;
  background: rgba(255,255,255,0.1);
  box-shadow: 0 0 0 4px rgba(64,158,255,0.15);
}
.search-icon {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  color: #5a6d80;
  font-size: 18px;
}
.search-stats {
  font-size: 12px;
  color: #5a6d80;
  margin-top: 8px;
  text-align: right;
}

/* Main layout */
.main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px;
  display: flex;
  gap: 24px;
  min-height: calc(100vh - 100px);
}

/* Results list */
.results-panel {
  width: 400px;
  flex-shrink: 0;
  overflow-y: auto;
  max-height: calc(100vh - 120px);
  padding-right: 8px;
}
.results-panel::-webkit-scrollbar { width: 6px; }
.results-panel::-webkit-scrollbar-thumb { background: rgba(64,158,255,0.3); border-radius: 3px; }

.result-card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px;
  padding: 14px 16px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: all 0.2s;
}
.result-card:hover {
  background: rgba(64,158,255,0.08);
  border-color: rgba(64,158,255,0.3);
  transform: translateX(4px);
}
.result-card.active {
  background: rgba(64,158,255,0.12);
  border-color: #409eff;
  box-shadow: 0 0 0 2px rgba(64,158,255,0.2);
}
.result-title {
  font-size: 15px;
  font-weight: 600;
  color: #e8f0fe;
  margin-bottom: 6px;
  line-height: 1.4;
}
.result-breadcrumb {
  font-size: 11px;
  color: #5a6d80;
  margin-bottom: 6px;
}
.result-desc {
  font-size: 13px;
  color: #8a9bb0;
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.result-media-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: #409eff;
  margin-top: 8px;
  background: rgba(64,158,255,0.1);
  padding: 2px 8px;
  border-radius: 4px;
}

/* Detail panel */
.detail-panel {
  flex: 1;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
  overflow-y: auto;
  max-height: calc(100vh - 120px);
  padding: 28px;
}
.detail-panel::-webkit-scrollbar { width: 6px; }
.detail-panel::-webkit-scrollbar-thumb { background: rgba(64,158,255,0.3); border-radius: 3px; }

.detail-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: #3a4f63;
}
.detail-empty-icon { font-size: 64px; margin-bottom: 16px; opacity: 0.5; }
.detail-empty-text { font-size: 16px; }

.detail-breadcrumb {
  font-size: 12px;
  color: #5a6d80;
  margin-bottom: 12px;
  padding: 6px 12px;
  background: rgba(255,255,255,0.03);
  border-radius: 6px;
  border-left: 3px solid #409eff;
}
.detail-title {
  font-size: 22px;
  font-weight: 700;
  color: #e8f0fe;
  margin-bottom: 16px;
  line-height: 1.4;
}
.detail-desc {
  font-size: 14px;
  color: #b0c0d0;
  line-height: 1.8;
  margin-bottom: 24px;
  padding: 16px;
  background: rgba(255,255,255,0.03);
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.06);
}
.detail-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: #409eff;
  text-decoration: none;
  font-size: 13px;
  padding: 8px 16px;
  border: 1px solid rgba(64,158,255,0.3);
  border-radius: 8px;
  transition: all 0.2s;
  margin-bottom: 24px;
}
.detail-link:hover {
  background: rgba(64,158,255,0.1);
  border-color: #409eff;
}

/* Media gallery */
.media-section { margin-top: 20px; }
.media-section-title {
  font-size: 14px;
  font-weight: 600;
  color: #8a9bb0;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.media-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 12px;
}
.media-item {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 8px;
  overflow: hidden;
  transition: all 0.2s;
}
.media-item:hover {
  border-color: rgba(64,158,255,0.4);
  transform: scale(1.02);
}
.media-item img {
  width: 100%;
  height: auto;
  display: block;
  cursor: pointer;
}
.media-item video {
  width: 100%;
  height: auto;
  display: block;
}
.media-label {
  padding: 8px 12px;
  font-size: 11px;
  color: #5a6d80;
  word-break: break-all;
}

/* Lightbox */
.lightbox {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.9);
  z-index: 1000;
  cursor: zoom-out;
  justify-content: center;
  align-items: center;
}
.lightbox.show { display: flex; }
.lightbox img {
  max-width: 95vw;
  max-height: 95vh;
  object-fit: contain;
  border-radius: 4px;
}

/* Responsive */
@media (max-width: 768px) {
  .main { flex-direction: column; }
  .results-panel { width: 100%; max-height: 40vh; }
  .detail-panel { max-height: 60vh; }
  .header-inner { flex-wrap: wrap; }
  .media-grid { grid-template-columns: 1fr; }
}

/* Highlight */
mark {
  background: rgba(64,158,255,0.3);
  color: #e8f0fe;
  padding: 0 2px;
  border-radius: 2px;
}
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon">ID</div>
      <div>
        <div class="logo-text">IDMVS 文档搜索</div>
        <div class="logo-sub">海康机器人 · 智能读码器管理与可视化软件</div>
      </div>
    </div>
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input class="search-input" id="searchInput" type="text" placeholder="输入关键词搜索功能、配置、操作说明..." autocomplete="off">
      <div class="search-stats" id="searchStats"></div>
    </div>
  </div>
</div>

<div class="main">
  <div class="results-panel" id="resultsPanel">
    <div class="result-card" style="text-align:center;color:#5a6d80;padding:40px;">
      输入关键词开始搜索
    </div>
  </div>
  <div class="detail-panel" id="detailPanel">
    <div class="detail-empty">
      <div class="detail-empty-icon">📖</div>
      <div class="detail-empty-text">选择左侧文档查看详情</div>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox" onclick="this.classList.remove('show')">
  <img id="lightboxImg" src="">
</div>

"}, {"path": "GUID-C2960969-7C93-4A35-B99E-9B1194CCB0C2-high.png", "type": "image"}]}, {"guid": "GUID-2C58E11C-E65A-48E7-BE49-8F58FADBE3B6", "filename": "GUID-2C58E11C-E65A-48E7-BE49-8F58FADBE3B6.html", "title": "IDMVS功能相关", "description": "客户端连接读码器后可以正常触发拍照，为什么关闭客户端就不能正常触发拍照了？ 因为未开启读码器的 相机自动工作 功能，详情参见 连接后配置 章节。 客户端打开自动工作并保存参数，是否需要重启读码器生效？ 无需重启，IDMVS断开对读码器的连接即可。 读码器如何通过客户端恢复出厂设置？ 目前仅全功能型(Mini)智能读码器和V4.0.0及以上版本固件的全功能型智能读码器支持恢复出厂设置。 ...", "breadcrumb": "常见问题 > IDMVS功能相关", "bodyText": "", "media": []}, {"guid": "GUID-2CAE75AC-5572-4379-9CB6-8887291D7314", "filename": "GUID-2CAE75AC-5572-4379-9CB6-8887291D7314.html", "title": "产品概述", "description": "IDMVS是海康机器人专为智能读码器设计、且全自主开发的应用软件，支持对全系列智能读码器进行调试，包括固定式、手持式、嵌入式等多种形态的读码器。IDMVS支持对读码器进行对焦、图像及码制参数设置、通讯配置、数据处理、IO设置等操作。IDMVS整体配置流程清晰，功能集中，可进行沉浸式配置，轻松实现用户的调试目标。", "breadcrumb": "产品概述", "bodyText": "IDMVS是", "media": []}, {"guid": "GUID-35355DBC-2DCD-4CFB-8FAD-7D41900C2563", "filename": "GUID-35355DBC-2DCD-4CFB-8FAD-7D41900C2563.html", "title": "动态场景下读码率低", "description": "当动态场景下读码器读码率低时，可从帧率、算法耗时、整体方案设计尝试解决。", "breadcrumb": "问题排查 > 条码识别与输出问题排查 > 动态场景下读码率低", "bodyText": "当动态场景下读码器读码率低时，可从帧率、算法耗时、整体方案设计尝试解决。", "media": []}, {"guid": "GUID-35799125-E661-4BFB-88A3-146B20B29FF9", "filename": "GUID-35799125-E661-4BFB-88A3-146B20B29FF9.html", "title": "读码器功能/特性相关", "description": "读码器开启相机自动工作后，相机设置的触发模式是什么？ 建议连接IDMVS进行查看，在设置参数时是有可能更改模式的。或者可以通过光源进行判断，光源如果在频闪，触发模式为关闭。 为什么8mm焦距的读码器自适应调节速度比16mm焦距的快？ 8 mm焦距相比于16 mm焦距，曝光、工作距离等适应条件较好，因此自适应调节的速度相对更快一点。 读码的视野范围可以通过参数调整吗? ...", "breadcrumb": "常见问题 > 读码器功能/特性相关", "bodyText": "", "media": []}, {"guid": "GUID-3C3D7CEB-6F13-4517-9ABE-D4CEE71593D8", "filename": "GUID-3C3D7CEB-6F13-4517-9ABE-D4CEE71593D8.html", "title": "结果显示", "description": "结果显示可对图像预览区域中读取结果的显示进行设置。", "breadcrumb": "菜单栏相关介绍 > 设置 > 结果显示", "bodyText": "", "media": [{"path": "GUID-67E61959-87C8-49BA-989A-A3899E6D3B8E-high.png", "type": "image"}, {"path": "GUID-25861822-9113-4035-B16F-EB451F8A3D99-high.png", "type": "image"}, {"path": : []}, {"guid": "GUID-A17C75D2-8073-4701-B3BD-2F38FE1C2AD8", "filename": "GUID-A17C75D2-8073-4701-B3BD-2F38FE1C2AD8.html", "title": "错误码", "description": "错误码为使用IDMVS过程中，执行操作异常后返回的信息代码。当返回错误码时，您可以查阅本章节错误码对照表获取说明及解决方法。", "breadcrumb": "错误码", "bodyText": "错误码为使用IDMVS过程中，执行操作异常后返回的信息代码。当返回错误码时，您可以查阅本章节错误码对照表获取说明及解决方法。", "media": []}, {"guid": "GUID-A2447B90-DEA6-4A6C-9EDA-5FEE07AD8664", "filename": "GUID-A2447B90-DEA6-4A6C-9EDA-5FEE07AD8664.html", "title": "设置", "description": "通过菜单栏的设置可对IDMVS及读码器进行全局相关设置。", "breadcrumb": "菜单栏相关介绍 > 设置", "bodyText": "通过菜单栏的", "media": []}, {"guid": "GUID-A337EA85-1E2F-4127-AEC0-D801E3852EE9", "filename": "GUID-A337EA85-1E2F-4127-AEC0-D801E3852EE9.html", "title": "可识别条码，但上位机接收码数据异常", "description": "上位机无法正常接收码数据时，可能和环境配置、参数设置、外部接线有关。", "breadcrumb": "问题排查 > 条码识别与输出问题排查 > 可识别条码，但上位机接收码数据异常", "bodyText": "上位机无法正常接收码数据时，可能和环境配置、参数设置、外部接线有关。", "media": []}, {"guid": "GUID-A4785986-11E1-4B06-A840-98B617E2B20C", "filename": "GUID-A4785986-11E1-4B06-A840-98B617E2B20C.html", "title": "通讯相关", "description": "读码器作为TCP 服务器可以连接几个TCP 客户端？ 8个。 读码器跟PLC进行TCP通讯，能否把读出来的信息转换成16进制输出给PLC？ 读码器输出为ASCII码，无法直接转换，需要PLC进行转换实现。 客户端里读到的数据为14，为什么传输到PLC设备显示的是12000？ 因为数据格式不匹配，IDMVS数据默认为ASCII码格式，建议使用PLC转换至ASCII格式。 ...", "breadcrumb": "常见问题 > 通讯相关", "bodyText": "", "media": []}, {"guid": "GUID-A49A7A2C-9786-463B-B026-31FE012E4FA7", "filename": "GUID-A49A7A2C-9786-463B-B026-31FE012E4FA7.html", "title": "参数轮询", "description": "针对动态复杂读码场景（如条码位置变化、光线波动等），参数轮询功能通过预设多组成像参数组合，读码器取流时自动切换参数适配环境变化，确保动态读码场景下条码识别的稳定性与准确性。本章节以开启多组参数轮询为例，为您介绍参数轮询功能。", "breadcrumb": "读码器常用配置 > 调试图像及码制 > 参数轮询", "bodyText": "针对动态复杂读码场景（如条码位置变化、光线波动等），参数轮询功能通过预设多组成像参数组合，读码器取流时自动切换参数适配环境变化，确保动态读码场景下条码识别的稳定性与准确性。本章节以开启多组参数轮询为例，为您介绍参数轮询功能。", "media": [{"path": "GUID-EC2E1E54-B941-4E59-8BA1-A17A5B552915-high.png", "type": "image"}, {"path": "GUID-CC0E42AE-B552-476F-B13C-6FEF66C3F19C-high.png", "type": "image"}, {"path": "GUID-4DF02E3E-0664-46AC-B730-0762E81FA6E6-high.png", "type": "image"}]}, {"guid": "GUID- "breadcrumb": "问题排查 > 连接问题排查 > 客户端无法发现读码器", "bodyText": "IDMVS无法发现读码器，可能和读码器属性、IP配置、通用相关设置有关。", "media": [{"path": "GUID-29783162-478A-4E1E-835F-8B308C5A02BC-high.png", "type": "image"}]}, {"guid": "GUID-B212CF88-F6C3-4BD9-B11A-37D3A8281D80", "filename": "GUID-B212CF88-F6C3-4BD9-B11A-37D3A8281D80.html", "title": "配置调试工具", "description": "通过TCP调试工具的网络设置模块，配置读码器通信指令参数。", "breadcrumb": "通信指令 > 通过TCP通信方式 > 配置调试工具", "bodyText": "通过TCP调试工具的", "media": []}, {"guid": "GUID-B58203FB-9ABB-42C6-A4A2-A9858372C789", "filename": "GUID-B58203FB-9ABB-42C6-A4A2-A9858372C789.html", "title": "一维码打码评级", "description": "打码评级功能支持对采集到的一维码图像进行质量评估和等级评分。一维码打码评级遵循 ISO/IEC 15416 标准， 分别从 6 个方面对条码进行判断， 选取所有参数中最低的等级作为条码的等级判断结果。", "breadcrumb": "读码器高级配置 > 评估码质量 > 一维码打码评级", "bodyText": "打码评级功能支持对采集到的一维码图像进行质量评估和等级评分。一维码打码评级遵循 ISO/IEC 15416 标准， 分别从 6 个方面对条码进行判断，\n        选取所有参数中最低的等级作为条码的等级判断结果。", "media": [{"path": "GUID-A4132222-EEE9-4E21-A4D3-23E3E2F7F89B-high.png", "type": "image"}, {"path": "GUID-B715D26A-4F89-424A-872A-D9AF94557669-high.png", "type": "image"}]}, {"guid": "GUID-B9202C17-0068-4879-9520-132F7C4F6BCB", "filename": "GUID-B9202C17-0068-4879-9520-132F7C4F6BCB.html", "title": "配置多读码器同步", "description": "当多台读码器同时进行采集图像解析条码时，可通过组播或主从组网功能使多读码器进行协同工作，实现多读码器同步触发和高效数据传输。同时支持在IDMVS主界面配置多画面布局同时预览多读码器画面。", "breadcrumb": "读码器高级配置 > 配置多读码器同步", "bodyText": "当多台读码器同时进行采集图像解析条码时，可通过组播或主从组网功能使多读码器进行协同工作，实现多读码器同步触发和高效数据传输。同时支持在IDMVS主界面配置多画面布局同时预览多读码器画面。", "media": []}, {"guid": "GUID-BC1B3F52-C3F7-4543-B6FC-86616640A46E", "filename": "GUID-BC1B3F52-C3F7-4543-B6FC-86616640A46E.html", "title": "条码裁剪", "description": "条码裁剪功能支持对读取的条码数据进行裁剪和处理，满足对条码数据进行特殊处理的需求，例如提取条码中特定数据、指定条码内容等。", "breadcrumb": "读码器常用配置 > 处理输出数据 > 条码裁剪", "bodyText": "条码裁剪功能支持对读取的条码数据进行裁剪和处理，满足对条码数据进行特殊处理的需求，例如提取条码中特定数据、指定条码内容等。", "media": [{"path": "GUID-2EAAAA60-BFBE-4CF3-9456-FDDA08BC6E0D-high.gif", "type": "image"}]}, {"guid": "GUID-BCB412AE-2905-412C-8DAD-1936782B0F93", "filename": "GUID-BCB412AE-2905-412C-8DAD-1936782B0F93.html", const BASE_URL = 'https://raw.githubusercontent.com/chenze3303/idmvs/main/';
let activeIndex = -1;

function loadData() {
  document.getElementById('searchStats').textContent = `共 ${DATA.length} 篇文档`;
  renderResults(DATA, '');
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlightText(text, query) {
  if (!query) return escapeHtml(text);
  const escaped = escapeHtml(text);
  const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
  return escaped.replace(regex, '<mark>$1</mark>');
}

function search(query) {
  if (!query.trim()) return DATA;
  const q = query.toLowerCase();
  return DATA
    .map(item => {
      let score = 0;
      if (item.title.toLowerCase().includes(q)) score += 10;
      if (item.description.toLowerCase().includes(q)) score += 5;
      if (item.breadcrumb.toLowerCase().includes(q)) score += 3;
      if (item.bodyText && item.bodyText.toLowerCase().includes(q)) score += 2;
      return { ...item, score };
    })
    .filter(item => item.score > 0)
    .sort((a, b) => b.score - a.score);
}

function renderResults(items, query) {
  const panel = document.getElementById('resultsPanel');
  
  if (items.length === 0) {
    panel.innerHTML = '<div style="text-align:center;color:#5a6d80;padding:40px;">未找到匹配的文档</div>';
    document.getElementById('searchStats').textContent = '无结果';
    return;
  }
  
  document.getElementById('searchStats').textContent = `找到 ${items.length} 篇文档`;
  
  panel.innerHTML = items.map((item, i) => `
    <div class="result-card${i === activeIndex ? ' active' : ''}" onclick="showDetail(${i}, '${query.replace(/'/g, "\\'")}')">
      <div class="result-title">${highlightText(item.title, query)}</div>
      ${item.breadcrumb ? `<div class="result-breadcrumb">📂 ${escapeHtml(item.breadcrumb)}</div>` : ''}
      <div class="result-desc">${highlightText(item.description, query)}</div>
      ${item.media && item.media.length > 0 ? `<div class="result-media-badge">🖼️ ${item.media.length} 个媒体文件</div>` : ''}
    </div>
  `).join('');
}

function showDetail(index, query) {
  activeIndex = index;
  const items = search(document.getElementById('searchInput').value);
  const item = items[index];
  if (!item) return;
  
  // Update active card
  document.querySelectorAll('.result-card').forEach((el, i) => {
    el.classList.toggle('active', i === index);
  });
  
  const mediaHtml = item.media && item.media.length > 0 ? `
    <div class="media-section">
      <div class="media-section-title">🖼️ 相关截图 / 媒体 (${item.media.length})</div>
      <div class="media-grid">
        ${item.media.map(m => {
          const url = BASE_URL + m.path;
          if (m.type === 'video') {
            return `<div class="media-item">
              <video controls src="${url}"></video>
              <div class="media-label">${escapeHtml(m.path)}</div>
            </div>`;
          }
          return `<div class="media-item">
            <img src="${url}" alt="${escapeHtml(m.path)}" loading="lazy" onclick="openLightbox('${url}')">
            <div class="media-label">${escapeHtml(m.path)}</div>
          </div>`;
        }).join('')}
      </div>
    </div>
  ` : '';
  
  document.getElementById('detailPanel').innerHTML = `
    ${item.breadcrumb ? `<div class="detail-breadcrumb">📂 ${escapeHtml(item.breadcrumb)}</div>` : ''}
    <div class="detail-title">${highlightText(item.title, query)}</div>
    <div class="detail-desc">${highlightText(item.description, query)}</div>
    <a class="detail-link" href="https://github.com/chenze3303/idmvs/blob/main/${item.filename}" target="_blank">
      🔗 在 GitHub 上查看原始文档
    </a>
    ${mediaHtml}
  `;
}

function openLightbox(url) {
  document.getElementById('lightboxImg').src = url;
  document.getElementById('lightbox').classList.add('show');
}

// Search input handler
let searchTimer;
document.getElementById('searchInput').addEventListener('input', (e) => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    const query = e.target.value;
    const results = search(query);
    activeIndex = -1;
    renderResults(results, query);
    
    // Auto-select first result
    if (results.length > 0) {
      showDetail(0, query);
    } else {
      document.getElementById('detailPanel').innerHTML = `
        <div class="detail-empty">
          <div class="detail-empty-icon">🔍</div>
          <div class="detail-empty-text">未找到匹配的文档</div>
        </div>
      `;
    }
  }, 200);
});

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== document.getElementById('searchInput')) {
    e.preventDefault();
    document.getElementById('searchInput').focus();
  }
  if (e.key === 'Escape') {
    document.getElementById('lightbox').classList.remove('show');
  }
});

loadData();
</script>
